# Config completa de nginx para servir la SPA (React + Vite + react-router).
# Se copia a /etc/nginx/nginx.conf (no a conf.d/) para poder controlar el `pid` y
# las rutas temporales, y así correr el proceso como usuario no-root.

worker_processes auto;

# El usuario no-root no puede escribir en /var/run; el pid va a /tmp/nginx.
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Todas las rutas temporales bajo /tmp/nginx (escribible por el usuario nginx).
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Compresión de texto para reducir el peso de transferencia.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/xml application/xml+rss
                      image/svg+xml;

    server {
        listen      80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Assets con hash en el nombre (Vite: app.a1b2c3.js). El contenido es
        # inmutable: si cambia, cambia el hash → se puede cachear un año sin riesgo.
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # Fallback de la SPA: react-router maneja las rutas en el cliente. Cualquier
        # ruta que no exista como archivo se resuelve devolviendo index.html para
        # que el router del navegador la interprete (sin esto, recargar /productos/5
        # daría un 404 de nginx).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html es el punto de entrada que referencia los assets con hash; si
        # se cachea, el navegador nunca vería un deploy nuevo. Nunca se cachea.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
